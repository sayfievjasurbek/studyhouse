<style>body{margin:0;background:#888}iframe{border:0;background:#fff;display:block}</style><body>
<script>document.addEventListener("DOMContentLoaded",()=>{const q=new URLSearchParams(location.search);localStorage.setItem('sh-lang',q.get('l'));
const f=document.createElement('iframe');f.src=q.get('p');f.width=q.get('w');f.height=q.get('h');document.body.appendChild(f);
f.onload=()=>{const d=f.contentDocument,w=f.contentWindow;const a=q.get('a');
 setTimeout(()=>{ if(a){w.shBooking.open(d.body);
   setTimeout(()=>{ const $=s=>d.querySelector(s);
     if(a==='error'){ $('#bk-form').requestSubmit(); }
     if(a==='fill'){ const t=(e,v)=>{e.focus();e.value=v;e.dispatchEvent(new w.Event('input',{bubbles:true}))}; t($('#bk-first'),'Aziz'); t($('#bk-phone'),'901234567'); $('#bk-country').focus(); }
   },500);} },300);};});
</script>
